name: Deploy React Frontend to IIS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: self-hosted

    env:
      SITE_PATH: C:\Sites\OzelDersVip\frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Node version
        shell: powershell
        run: |
          node -v
          npm.cmd -v

      - name: Install dependencies
        shell: powershell
        run: npm.cmd ci

      - name: Create production env
        shell: powershell
        run: |
          @"
          VITE_API_BASE_URL=http://api.ozeldersvip.com
          VITE_API_URL=http://api.ozeldersvip.com
          VITE_BASE_API_URL=http://api.ozeldersvip.com
          VITE_SIGNALR_URL=http://api.ozeldersvip.com/chat
          "@ | Set-Content -Path ".env.production" -Encoding UTF8

      - name: Build frontend
        shell: powershell
        run: npm.cmd run build

      - name: Deploy to IIS folder
        shell: powershell
        run: |
          $sitePath = $env:SITE_PATH
          $distPath = Join-Path $PWD "dist"

          if (!(Test-Path $sitePath)) {
            New-Item -ItemType Directory -Path $sitePath -Force | Out-Null
          }

          Get-ChildItem -Path $sitePath -Force | Remove-Item -Recurse -Force
          Copy-Item -Path "$distPath\*" -Destination $sitePath -Recurse -Force

      - name: Test frontend domain
        shell: powershell
        continue-on-error: true
        run: |
          Start-Sleep -Seconds 5
          Invoke-WebRequest -UseBasicParsing http://ozeldersvip.com -TimeoutSec 30 | Select-Object StatusCode, Content
