name: Deploy React Frontend to IIS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: self-hosted

    env:
      SITE_PATH: C:\Sites\OzelDersVip\frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Node version
        shell: powershell
        run: |
          node -v
          npm.cmd -v

      - name: Install dependencies
        shell: powershell
        run: npm.cmd ci

      - name: Create production env
        shell: powershell
        run: |
          @"
          VITE_API_BASE_URL=https://api.ozeldersvip.com
          VITE_API_URL=https://api.ozeldersvip.com
          VITE_BASE_API_URL=https://api.ozeldersvip.com
          VITE_SIGNALR_URL=https://api.ozeldersvip.com/chat
          VITE_FIREBASE_API_KEY=AIzaSyCB62Hh5H-UtI58-KoRg4MgCFJ5R1ZaxtA
          VITE_FIREBASE_AUTH_DOMAIN=ozeldersvip-51804.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=ozeldersvip-51804
          VITE_FIREBASE_STORAGE_BUCKET=ozeldersvip-51804.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=116388426739
          VITE_FIREBASE_APP_ID=1:116388426739:web:0c145282f0aa0ac6751886
          VITE_FIREBASE_VAPID_KEY=
          "@ | Set-Content -Path ".env.production" -Encoding UTF8

      - name: Build frontend
        shell: powershell
        run: npm.cmd run build

      - name: Deploy to IIS folder
        shell: powershell
        run: |
          $sitePath = $env:SITE_PATH
          $distPath = Join-Path $PWD "dist"

          if (!(Test-Path $sitePath)) {
            New-Item -ItemType Directory -Path $sitePath -Force | Out-Null
          }

          Get-ChildItem -Path $sitePath -Force | Remove-Item -Recurse -Force
          Copy-Item -Path "$distPath\*" -Destination $sitePath -Recurse -Force

      - name: Test frontend domain
        shell: powershell
        continue-on-error: true
        run: |
          Start-Sleep -Seconds 5
          Invoke-WebRequest -UseBasicParsing https://ozeldersvip.com -TimeoutSec 30 | Select-Object StatusCode, Content
